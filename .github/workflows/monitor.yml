name: Collect platform status
on:
  schedule:
    - cron: "2-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "content/incidents/**", "scripts/**", ".github/workflows/monitor.yml"]
permissions:
  contents: write
concurrency:
  group: status-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore published history
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/status-data"
          set +e
          git ls-remote --exit-code --heads origin status-data > /dev/null
          branch_result=$?
          set -e
          if [ "$branch_result" = 0 ]; then
            git fetch origin status-data:refs/remotes/origin/status-data
            git worktree add "$data_dir" refs/remotes/origin/status-data
            cp "$data_dir/status.json" public/status.json
          elif [ "$branch_result" = 2 ]; then
            git worktree add --detach "$data_dir" HEAD
            git -C "$data_dir" switch --orphan status-data
          else
            echo "Unable to read published history; refusing to reset it."
            exit 1
          fi
      - run: node --test tests/*.test.mjs
      - name: Collect project and provider health
        run: node scripts/collect-status.mjs
        env:
          SUPABASE_URL: ${{ secrets.STATUS_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.STATUS_SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STATUS_SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATUS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STATUS_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.STATUS_CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.STATUS_CLOUDFLARE_WORKER_NAME || 'partners-api' }}
          CLOUDFLARE_DAILY_REQUEST_LIMIT: ${{ vars.STATUS_CLOUDFLARE_DAILY_REQUEST_LIMIT }}
          CLOUDFLARE_MONTHLY_REQUEST_LIMIT: ${{ vars.STATUS_CLOUDFLARE_MONTHLY_REQUEST_LIMIT }}
          STATUS_SLOW_RESPONSE_MS: ${{ vars.STATUS_SLOW_RESPONSE_MS || '3000' }}
          GAS_EMAIL_WEBHOOK_URL: ${{ secrets.STATUS_GAS_EMAIL_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.STATUS_DISCORD_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.STATUS_TELEGRAM_BOT_TOKEN }}
      - run: node scripts/validate-status.mjs
      - name: Publish data independently of the site
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/status-data"
          cp public/status.json "$data_dir/status.json"
          cp public/feed.xml "$data_dir/feed.xml"
          git -C "$data_dir" config user.name 'github-actions[bot]'
          git -C "$data_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$data_dir" add status.json feed.xml
          if ! git -C "$data_dir" diff --cached --quiet; then
            git -C "$data_dir" commit -m 'Record platform availability observations' -m 'Update measured service results, retained daily history and published incident updates.'
            git -C "$data_dir" push origin HEAD:status-data
          fi
